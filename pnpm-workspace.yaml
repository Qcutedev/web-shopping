allowBuilds:
  esbuild: false
  "@prisma/engines": false
  prisma: false
  sharp: false
  unrs-resolver: false

# SEC-036 (D-034): better-auth lists mysql2 as an optional peer and pnpm installed it. The
# application uses PostgreSQL and nothing reachable imports mysql2, but it carried two advisories.
# "-" removes the package from the tree instead of silencing the audit. Remove this entry if the
# project ever uses MySQL.
overrides:
  mysql2: "-"
  # CR-82: Prisma 7.10 with @prisma/adapter-pg starts the relation loads of one query together on
  # the single pg client of an interactive transaction. pg 8 queues them (with a DeprecationWarning);
  # pg 9 removes the queueing and such a transaction would fail. Keep pg on major 8 until the
  # adapter stops overlapping queries or the code follows DATA_MODEL.md section 7.8 everywhere.
  pg: "^8"
  # D-051: @vercel/cli-config (via @vercel/blob > @vercel/oidc) pins zod 4.1.11, which has
  # GHSA-mrhx-c7xc-m3w5. No upstream release fixes it; the adapter never reaches that code path.
  "@vercel/cli-config>zod": "4.6.7"
